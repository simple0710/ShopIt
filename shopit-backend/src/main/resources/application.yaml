spring:
  application:
    name: shopit

  datasource:
    url: jdbc:h2:mem:test
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  config:
    import: optional:classpath:application-secret.yaml

server:
  servlet:
    context-path: /api/v1
  port: 8080